{% extends "welcome.html" %}
{% block content %}
<h2>Your URN → URL Mappings</h2>
<form method="post">
    <input type="text" name="urn" placeholder="URN" required>
    <input type="text" name="url" placeholder="URL" required>
    <button type="submit" name="action" value="add">Add/Update Mapping</button>
</form>
<ul>
    {% for urn, url in mappings.items() %}
    <li>
        <strong>{{ urn }}</strong>: <a href="{{ url }}" target="_blank">{{ url }}</a>
        <form method="post" style="display:inline">
            <input type="hidden" name="urn" value="{{ urn }}">
            <button type="submit" name="action" value="remove">Remove</button>
        </form>
    </li>
    {% endfor %}
</ul>
{% endblock %}
