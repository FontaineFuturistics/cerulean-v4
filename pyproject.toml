[project]
name = "cerulean-v4"
version = "0.1.0"
description = "Serverside implementation of Cerulean URN mapper"
authors = [
    {name = "FontaineFuturistics",email = "liam.estell@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "mysql-connector-python (>=9.4.0,<10.0.0)",
    "werkzeug (>=3.1.3,<4.0.0)"
]

[tool.poetry]
packages = [{include = "cerulean_v4", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
