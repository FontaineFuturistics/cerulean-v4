<IfModule mod_ssl.c>
  <VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    SSLEngine on
    SSLCertificateFile    /etc/ssl/server/server.crt.pem
    SSLCertificateKeyFile /etc/ssl/server/server.key.pem

    # Trust only our CA and request client cert
    SSLCACertificateFile /etc/ssl/ca/ca.crt.pem
    SSLVerifyClient optional
    SSLVerifyDepth 1

    <Directory /var/www/html>
      Options Indexes FollowSymLinks
      AllowOverride None
      Require all granted
    </Directory>

    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
  </VirtualHost>
</IfModule>
